spring.application.name=CampusSignal
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/campussignal}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.h2.console.enabled=false
# SQL errors can contain email bodies/addresses; callers receive safe summaries instead.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

gmail.credentials-file=${GMAIL_CREDENTIALS_FILE:credentials.json}
gmail.token-directory=${GMAIL_TOKEN_DIRECTORY:.gmail-tokens}
gmail.callback-port=${GMAIL_CALLBACK_PORT:8888}
gmail.max-results=${GMAIL_MAX_RESULTS:10}
gmail.user-id=${GMAIL_USER_ID:me}
gmail.google-cloud-project=${GOOGLE_CLOUD_PROJECT:}
gmail.pubsub-topic=${GMAIL_PUBSUB_TOPIC:}
gmail.pubsub-subscription=${GMAIL_PUBSUB_SUBSCRIPTION:}
gmail.recovery-max-results=${GMAIL_RECOVERY_MAX_RESULTS:10}

category-score.explicit-weight=${CATEGORY_SCORE_EXPLICIT_WEIGHT:0.40}
category-score.profile-weight=${CATEGORY_SCORE_PROFILE_WEIGHT:0.15}
category-score.behavioral-weight=${CATEGORY_SCORE_BEHAVIORAL_WEIGHT:0.35}
category-score.related-weight=${CATEGORY_SCORE_RELATED_WEIGHT:0.10}
category-score.initial-behavioral=${CATEGORY_SCORE_INITIAL_BEHAVIORAL:0.5}
category-score.initial-related=${CATEGORY_SCORE_INITIAL_RELATED:0.0}

spring.jackson.deserialization.accept-float-as-int=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
