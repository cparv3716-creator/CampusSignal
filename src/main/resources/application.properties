spring.application.name=CampusSignal
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/campussignal}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.h2.console.enabled=false
# SQL errors can contain email bodies/addresses; callers receive safe summaries instead.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

gmail.credentials-file=${GMAIL_CREDENTIALS_FILE:credentials.json}
gmail.token-directory=${GMAIL_TOKEN_DIRECTORY:.gmail-tokens}
gmail.callback-port=${GMAIL_CALLBACK_PORT:8888}
gmail.max-results=${GMAIL_MAX_RESULTS:10}
gmail.user-id=${GMAIL_USER_ID:me}
gmail.google-cloud-project=${GOOGLE_CLOUD_PROJECT:}
gmail.pubsub-topic=${GMAIL_PUBSUB_TOPIC:}
gmail.pubsub-subscription=${GMAIL_PUBSUB_SUBSCRIPTION:}
gmail.recovery-max-results=${GMAIL_RECOVERY_MAX_RESULTS:10}
gmail.sync-max-results=${GMAIL_SYNC_MAX_RESULTS:10}
campussignal.operator-secret=${CAMPUSSIGNAL_OPERATOR_SECRET:}
campussignal.allowed-origin=${CAMPUSSIGNAL_ALLOWED_ORIGIN:http://127.0.0.1:5174}
campussignal.auth.required=${CAMPUSSIGNAL_AUTH_REQUIRED:true}
campussignal.auth.session-hours=${CAMPUSSIGNAL_AUTH_SESSION_HOURS:8}
campussignal.frontend-uri=${CAMPUSSIGNAL_FRONTEND_URI:http://127.0.0.1:5174}
campussignal.cookie-secure=${CAMPUSSIGNAL_COOKIE_SECURE:false}
campussignal.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
campussignal.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
campussignal.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://127.0.0.1:8092/api/v1/auth/google/callback}
campussignal.google.authorize-uri=https://accounts.google.com/o/oauth2/v2/auth
campussignal.google.token-uri=https://oauth2.googleapis.com/token
campussignal.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
campussignal.token-encryption-key=${CAMPUSSIGNAL_TOKEN_ENCRYPTION_KEY:}
campussignal.local-ai.enabled=${CAMPUSSIGNAL_LOCAL_AI_ENABLED:false}
campussignal.local-ai.ollama-endpoint=${CAMPUSSIGNAL_OLLAMA_ENDPOINT:http://127.0.0.1:11434}
campussignal.local-ai.model=${CAMPUSSIGNAL_LOCAL_AI_MODEL:llama3.2:3b-instruct}
campussignal.local-ai.timeout-ms=${CAMPUSSIGNAL_LOCAL_AI_TIMEOUT_MS:10000}
campussignal.local-ai.acquire-timeout-ms=${CAMPUSSIGNAL_LOCAL_AI_ACQUIRE_TIMEOUT_MS:100}

category-score.explicit-weight=${CATEGORY_SCORE_EXPLICIT_WEIGHT:0.40}
category-score.profile-weight=${CATEGORY_SCORE_PROFILE_WEIGHT:0.15}
category-score.behavioral-weight=${CATEGORY_SCORE_BEHAVIORAL_WEIGHT:0.35}
category-score.related-weight=${CATEGORY_SCORE_RELATED_WEIGHT:0.10}
category-score.initial-behavioral=${CATEGORY_SCORE_INITIAL_BEHAVIORAL:0.5}
category-score.initial-related=${CATEGORY_SCORE_INITIAL_RELATED:0.0}

spring.jackson.deserialization.accept-float-as-int=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
