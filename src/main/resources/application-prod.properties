# Production database configuration
# Required environment variables are configured on Vercel.

# Vercel containers must accept traffic on every interface and the injected PORT.
server.address=0.0.0.0

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# Initial academic deployment only.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Do not expose the local-only Gmail synchronization endpoint.
campussignal.gmail-sync.enabled=false
