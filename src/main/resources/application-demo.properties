# Self-contained CS5013 evaluator profile. This profile is intentionally isolated
# from the local file database and the PostgreSQL production profile.
server.address=0.0.0.0
server.port=80

spring.datasource.url=jdbc:h2:mem:campussignal-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Seed only reserved example.com identities. Gmail and optional external services
# remain disabled and require no credentials or secrets.
campussignal.demo-data.enabled=true
campussignal.auth.required=true
campussignal.gmail-sync.enabled=false
campussignal.local-ai.enabled=false
gmail.credentials-file=/app/no-gmail-credentials.json
gmail.token-directory=/tmp/campussignal-no-gmail-tokens
